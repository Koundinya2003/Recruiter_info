[project]
name = "job-search-workspace"
version = "1.0.0"
description = "Job discovery, recruiter outreach and application tracking: find real, validated openings, who to contact about them, and keep track."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
# The starter list of company job boards ships with the package.
app = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "S"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "SIM108", # ternaries are not always more readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
plugins = []
exclude = "(^\\.venv/|^migrations/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require a live PostgreSQL database",
]
filterwarnings = ["ignore::DeprecationWarning"]
